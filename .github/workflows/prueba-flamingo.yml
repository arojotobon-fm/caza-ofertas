# PRUEBA ÚNICA (22 nov 2026, corrida 2 con enlaces fijos): Flamingo en el buscador y el Verificador desde un servidor. No publica ni toca main.
name: Prueba de Flamingo
on:
  push:
    branches: [etapa-1-modelo-datos]
    paths: [".github/workflows/prueba-flamingo.yml"]
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: mkdir -p pruebas && node scripts/prueba_flamingo.mjs pruebas/flamingo.json | tee pruebas/resumen-flamingo.json
      - if: always()
        run: |
          git add pruebas
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Resultados de la prueba de Flamingo" || exit 0
          git push origin HEAD:etapa-1-modelo-datos
