# PRUEBA ÚNICA (no es la tarea diaria). Autorizada el 22 nov 2026. Corrida 2: después de corregir el empate.
# Corre en la rama de trabajo etapa-1-modelo-datos:
#  1) la misma lectura de precios que hará la tarea diaria, y la guarda en la rama "historial" (primer registro real);
#  2) el Verificador contra 30 enlaces reales, y deja los resultados en pruebas/ de esta misma rama.
# No toca main ni publica en Netlify.
name: Prueba del historial y del Verificador
on:
  push:
    branches: [etapa-1-modelo-datos]
    paths: [".github/workflows/prueba-historial.yml"]
permissions:
  contents: write
concurrency: historial
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traer la rama historial (igual que la tarea diaria)
        run: |
          if git ls-remote --exit-code --heads origin historial; then
            git fetch origin historial:historial
            git worktree add ../hist historial
          else
            git worktree add --detach ../hist
            cd ../hist && git checkout --orphan historial && git rm -rqf . || true
          fi
      - name: Leer precios de hoy (igual que la tarea diaria)
        run: |
          mkdir -p pruebas
          python3 scripts/historial_diario.py --catalogo data/ofertas.json --historial ../hist/precios.json | tee pruebas/resumen-historial.json
      - name: Guardar en la rama historial (igual que la tarea diaria)
        run: |
          cd ../hist
          printf '[build]\n  ignore = "exit 0"\n' > netlify.toml
          echo "Historial diario de precios. Lo escribe GitHub Actions; no editar a mano." > README.md
          git add precios.json netlify.toml README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Historial $(TZ=America/Bogota date +%F)" || exit 0
          git push origin historial
      - name: Verificador contra 30 enlaces reales
        run: node scripts/prueba_verificador.mjs data/ofertas.json pruebas/verificador.json | tee pruebas/resumen-verificador.json
      - name: Dejar los resultados en esta rama
        if: always()
        run: |
          git add pruebas
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Resultados de la prueba del historial y del Verificador" || exit 0
          git push origin HEAD:etapa-1-modelo-datos
